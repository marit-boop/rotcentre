<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="Rotation centre by crane hook – offline calculator for multiple cranes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ROT Centre">
<title>ROT Centre</title>
<style>
:root{
  --bg:#0b1220;--panel:#121b2e;--panel2:#18233a;--line:#26324c;--text:#e6ecf5;--muted:#8a97b0;
  --accent:#f5a524;--accent-ink:#1a1204;--x:#5cc8ff;--y:#7ee08a;--danger:#ff6b6b;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
header h1{font-size:20px;margin:0;letter-spacing:.3px}
header h1 span{color:var(--accent)}
header .sub{color:var(--muted);font-size:12px}
header .sp{flex:1}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:40px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;white-space:nowrap}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.tab.add{border-style:dashed;color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.link{background:none;border:0;color:var(--accent);font-size:13px;padding:2px 4px;text-transform:none;letter-spacing:0}
.pos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{background:var(--panel2);border-radius:10px;padding:8px 10px}
.kv .k{font-size:12px;color:var(--muted)}
.kv .v{font-size:17px;font-variant-numeric:tabular-nums}
.field{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field label{display:block}
.field label small{display:block;color:var(--muted);font-size:11px}
.inbox{display:flex;align-items:center;gap:6px}
.inbox input{width:110px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);
  font:inherit;font-size:17px;padding:9px 10px;text-align:right;font-variant-numeric:tabular-nums}
.inbox input:focus{outline:none;border-color:var(--accent)}
.inbox .u{width:20px;color:var(--muted);font-size:13px}
.pm{background:var(--panel2);border:1px solid var(--line);border-radius:10px;width:40px;height:42px;font-size:18px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.out{border-radius:12px;padding:12px;background:var(--panel2);border-left:4px solid var(--x)}
.out.y{border-left-color:var(--y)}
.out .k{font-size:12px;color:var(--muted)}
.out .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px}
.out .d{font-size:14px;margin-top:4px}
.out .d b{color:var(--accent)}
svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:right;border-top:1px solid var(--line)}
th{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;border-top:0}
td:first-child,th:first-child{text-align:left}
.note{color:var(--muted);font-size:12px;line-height:1.5}
.note code{color:var(--text);font-size:12px}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 16px;font-weight:600}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.scrim.on{display:flex}
.sheet{background:var(--panel);border-top-left-radius:18px;border-top-right-radius:18px;width:100%;max-width:560px;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:17px}
.sheet .row{margin-bottom:12px}
.sheet .row>label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.sheet input[type=text],.sheet textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  color:var(--text);font:inherit;font-size:16px;padding:10px}
.sheet textarea{font-family:ui-monospace,monospace;font-size:12px;height:160px}
.sheet .inbox input{width:100%}
.sheet .inbox{width:100%}
.actions{display:flex;gap:8px;margin-top:6px}
.actions .btn{flex:1}
.err{color:var(--danger);font-size:13px;min-height:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>ROT <span>Centre</span></h1>
      <div class="sub">Rotation centre by crane hook</div>
    </div>
    <div class="sp"></div>
    <button class="iconbtn" id="btnAll" title="All cranes">☰</button>
    <button class="iconbtn" id="btnMenu" title="Backup / help">⋯</button>
  </header>
  <div class="tabs" id="tabs"></div>
  <main id="main"></main>
</div>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

<script>
(function(){
'use strict';
var KEY='rotcentre.v1';
var rad=function(d){return d*Math.PI/180};
function num(s){ if(typeof s==='number') return s; s=String(s==null?'':s).trim().replace(',','.'); if(s===''||s==='-'||s==='.') return NaN; return Number(s); }
function f2(v){ return isFinite(v)? (Math.abs(v)<0.005?0:v).toFixed(2) : '—'; }
function uid(){ return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}); }

var DEFAULT={cur:null,cranes:[
  {id:'c1',name:'Crane 1',ox:-24.82,oy:-9.27,inp:{r:21.1,slew:322.4,h:42,heel:0.5,trim:0.2}},
  {id:'c2',name:'Crane 2',ox:-58.42,oy:-10.61,inp:{r:10,slew:180,h:38,heel:0,trim:0}}
]};
var S;
function load(){
  try{ var j=JSON.parse(localStorage.getItem(KEY)); if(j&&Array.isArray(j.cranes)) S=j; }catch(e){}
  if(!S) S=JSON.parse(JSON.stringify(DEFAULT));
  if(!S.cur||!find(S.cur)) S.cur=S.cranes.length?S.cranes[0].id:null;
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function find(id){ for(var i=0;i<S.cranes.length;i++) if(S.cranes[i].id===id) return S.cranes[i]; return null; }

/* ---- core calculation (identical to Excel sheet) ----
   X (+FWD/-AFT) = OffX + R*cos(slew) + H*sin(trim)
   Y (+SB/-PS)   = OffY + R*sin(slew) + H*sin(heel)          */
function calc(c){
  var i=c.inp, R=num(i.r), A=num(i.slew), H=num(i.h), heel=num(i.heel), trim=num(i.trim);
  var hx=c.ox+R*Math.cos(rad(A)), hy=c.oy+R*Math.sin(rad(A));
  return {hx:hx,hy:hy,x:hx+H*Math.sin(rad(trim)),y:hy+H*Math.sin(rad(heel))};
}
function dirX(v){ return !isFinite(v)?'':(Math.abs(v)<0.005?'at midship':(Math.abs(v).toFixed(2)+' m '+(v>0?'FWD':'AFT'))); }
function dirY(v){ return !isFinite(v)?'':(Math.abs(v)<0.005?'on centreline':(Math.abs(v).toFixed(2)+' m '+(v>0?'SB':'PS'))); }

var FIELDS=[
  {k:'r',   l:'Radius',             u:'m', s:false},
  {k:'slew',l:'Slew angle',         u:'°', s:false, h:'0° bow · 90° SB · 180° stern · 270° PS'},
  {k:'h',   l:'Height of wire point',u:'m', s:false},
  {k:'heel',l:'Heel',               u:'°', s:true,  h:'+ SB / − PS'},
  {k:'trim',l:'Trim',               u:'°', s:true,  h:'+ FWD / − AFT'}
];

var view='crane';
function render(){
  renderTabs();
  var m=document.getElementById('main');
  if(view==='all'){ m.innerHTML=allHTML(); return; }
  var c=find(S.cur);
  if(!c){ m.innerHTML='<div class="card empty">No cranes yet.<br><br><button class="btn" data-act="add">+ Add crane</button></div>'; return; }
  var h='';
  h+='<div class="card"><h2>Crane position <span class="sp"></span><button class="link" data-act="edit">Edit</button></h2>'+
     '<div class="pos"><div class="kv"><div class="k">Offset X (+FWD / −AFT)</div><div class="v">'+f2(c.ox)+' m</div></div>'+
     '<div class="kv"><div class="k">Offset Y (+SB / −PS)</div><div class="v">'+f2(c.oy)+' m</div></div></div>'+
     '<div class="note" style="margin-top:8px">Relative to midship (X 0 / Y 0)</div></div>';
  h+='<div class="card"><h2>Input data</h2>';
  FIELDS.forEach(function(f){
    h+='<div class="field"><label for="f_'+f.k+'">'+f.l+(f.h?'<small>'+f.h+'</small>':'')+'</label><div class="inbox">'+
       (f.s?'<button class="pm" data-pm="'+f.k+'">±</button>':'')+
       '<input id="f_'+f.k+'" data-k="'+f.k+'" type="text" inputmode="decimal" autocomplete="off" value="'+esc(c.inp[f.k]==null?'':c.inp[f.k])+'">'+
       '<span class="u">'+f.u+'</span></div></div>';
  });
  h+='</div>';
  h+='<div class="card"><h2>Rotation centre</h2><div class="res">'+
     '<div class="out"><div class="k">Ahead / Astern</div><div class="v" id="oX"></div><div class="d" id="dX"></div></div>'+
     '<div class="out y"><div class="k">SB / PS</div><div class="v" id="oY"></div><div class="d" id="dY"></div></div></div></div>';
  h+='<div class="card"><h2>Plan view <span class="sp"></span><span style="text-transform:none;letter-spacing:0">bow ↑</span></h2><div id="plan"></div>'+
     '<div class="legend"><span><i style="background:var(--muted)"></i>Midship</span><span><i style="background:var(--x)"></i>Crane</span>'+
     '<span><i style="background:#fff"></i>Hook (no heel/trim)</span><span><i style="background:var(--accent)"></i>ROT centre</span></div></div>';
  m.innerHTML=h;
  update();
}
function update(){
  var c=find(S.cur); if(!c) return;
  var r=calc(c);
  document.getElementById('oX').textContent=f2(r.x);
  document.getElementById('oY').textContent=f2(r.y);
  document.getElementById('dX').innerHTML='<b>'+esc(dirX(r.x))+'</b>';
  document.getElementById('dY').innerHTML='<b>'+esc(dirY(r.y))+'</b>';
  document.getElementById('plan').innerHTML=plan(c,r);
}
function renderTabs(){
  var t='<button class="tab'+(view==='all'?' on':'')+'" data-tab="__all">All</button>';
  S.cranes.forEach(function(c){ t+='<button class="tab'+(view==='crane'&&c.id===S.cur?' on':'')+'" data-tab="'+c.id+'">'+esc(c.name)+'</button>'; });
  t+='<button class="tab add" data-act="add">+ Crane</button>';
  document.getElementById('tabs').innerHTML=t;
}
function allHTML(){
  if(!S.cranes.length) return '<div class="card empty">No cranes yet.<br><br><button class="btn" data-act="add">+ Add crane</button></div>';
  var h='<div class="card"><h2>All cranes · rotation centre</h2><table><tr><th>Crane</th><th>Ahead/Astern</th><th>SB/PS</th></tr>';
  S.cranes.forEach(function(c){ var r=calc(c);
    h+='<tr data-tab="'+c.id+'"><td>'+esc(c.name)+'</td><td>'+f2(r.x)+'<div class="note">'+esc(dirX(r.x))+'</div></td><td>'+f2(r.y)+'<div class="note">'+esc(dirY(r.y))+'</div></td></tr>'; });
  h+='</table></div>';
  h+='<div class="card"><h2>Plan view · all cranes</h2>'+planAll()+'</div>';
  return h;
}

/* ---- plan view SVG (X fwd = up, Y SB = right) ---- */
function frame(pts){
  var minx=0,maxx=0,miny=0,maxy=0;
  pts.forEach(function(p){ if(!isFinite(p[0])||!isFinite(p[1])) return; minx=Math.min(minx,p[0]);maxx=Math.max(maxx,p[0]);miny=Math.min(miny,p[1]);maxy=Math.max(maxy,p[1]); });
  var W=320,H=260,pad=26, sx=(maxy-miny)||1, sy=(maxx-minx)||1, k=Math.min((W-2*pad)/sx,(H-2*pad)/sy);
  var cx=(miny+maxy)/2, cy=(minx+maxx)/2;
  return {W:W,H:H,k:k,P:function(x,y){ return [W/2+(y-cx)*k, H/2-(x-cy)*k]; }};
}
function axes(F){
  var o=F.P(0,0);
  return '<line x1="0" y1="'+o[1]+'" x2="'+F.W+'" y2="'+o[1]+'" stroke="var(--line)" stroke-dasharray="4 4"/>'+
         '<line x1="'+o[0]+'" y1="0" x2="'+o[0]+'" y2="'+F.H+'" stroke="var(--line)" stroke-dasharray="4 4"/>'+
         '<text x="'+(o[0]+4)+'" y="12" fill="var(--muted)" font-size="10">FWD</text>'+
         '<text x="'+(F.W-18)+'" y="'+(o[1]-4)+'" fill="var(--muted)" font-size="10">SB</text>'+
         '<text x="2" y="'+(o[1]-4)+'" fill="var(--muted)" font-size="10">PS</text>'+
         '<circle cx="'+o[0]+'" cy="'+o[1]+'" r="4" fill="var(--muted)"/>';
}
function plan(c,r){
  var F=frame([[c.ox,c.oy],[r.hx,r.hy],[r.x,r.y]]);
  if(!isFinite(r.x)||!isFinite(r.y)) return '<svg viewBox="0 0 '+F.W+' '+F.H+'">'+axes(F)+'</svg>';
  var p=F.P(c.ox,c.oy),q=F.P(r.hx,r.hy),z=F.P(r.x,r.y),R=Math.abs(num(c.inp.r))*F.k;
  return '<svg viewBox="0 0 '+F.W+' '+F.H+'">'+axes(F)+
    (isFinite(R)?'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+R+'" fill="none" stroke="var(--x)" stroke-opacity=".25"/>':'')+
    '<line x1="'+p[0]+'" y1="'+p[1]+'" x2="'+q[0]+'" y2="'+q[1]+'" stroke="var(--x)" stroke-width="3" stroke-linecap="round"/>'+
    '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="6" fill="var(--x)"/>'+
    '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="4" fill="#fff"/>'+
    '<circle cx="'+z[0]+'" cy="'+z[1]+'" r="7" fill="none" stroke="var(--accent)" stroke-width="2.5"/>'+
    '<circle cx="'+z[0]+'" cy="'+z[1]+'" r="2.5" fill="var(--accent)"/>'+
    '</svg>';
}
function planAll(){
  var pts=[],rs=[];
  S.cranes.forEach(function(c){ var r=calc(c); rs.push(r); pts.push([c.ox,c.oy],[r.x,r.y]); });
  var F=frame(pts), s='<svg viewBox="0 0 '+F.W+' '+F.H+'">'+axes(F);
  S.cranes.forEach(function(c,i){ var r=rs[i], p=F.P(c.ox,c.oy);
    if(isFinite(r.x)&&isFinite(r.y)){ var z=F.P(r.x,r.y);
      s+='<line x1="'+p[0]+'" y1="'+p[1]+'" x2="'+z[0]+'" y2="'+z[1]+'" stroke="var(--x)" stroke-opacity=".6" stroke-width="2"/>'+
         '<circle cx="'+z[0]+'" cy="'+z[1]+'" r="6" fill="none" stroke="var(--accent)" stroke-width="2.5"/>'; }
    s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="var(--x)"/><text x="'+(p[0]+8)+'" y="'+(p[1]+4)+'" fill="var(--text)" font-size="11">'+esc(c.name)+'</text>';
  });
  return s+'</svg>';
}

/* ---- bottom sheet with Android back support ---- */
var sheetOpen=false, closingByCode=false;
function openSheet(html,onBind){
  document.getElementById('sheet').innerHTML=html;
  document.getElementById('scrim').classList.add('on');
  if(!sheetOpen){ sheetOpen=true; try{ history.pushState({sheet:1},''); }catch(e){} }
  if(onBind) onBind(document.getElementById('sheet'));
}
function hideSheet(){ document.getElementById('scrim').classList.remove('on'); sheetOpen=false; }
function closeSheet(){ if(!sheetOpen) return; hideSheet(); closingByCode=true; try{ history.back(); }catch(e){ closingByCode=false; } }
window.addEventListener('popstate',function(){ if(closingByCode){ closingByCode=false; return; } if(sheetOpen) hideSheet(); });
document.getElementById('scrim').addEventListener('click',function(e){ if(e.target.id==='scrim') closeSheet(); });

function signed(id,label,val,help){
  return '<div class="row"><label for="'+id+'">'+label+(help?' · '+help:'')+'</label><div class="inbox"><button class="pm" type="button" data-pmid="'+id+'">±</button>'+
         '<input id="'+id+'" type="text" inputmode="decimal" autocomplete="off" value="'+esc(val)+'"><span class="u">m</span></div></div>';
}
function craneForm(c){
  var isNew=!c;
  c=c||{name:'Crane '+(S.cranes.length+1),ox:'',oy:''};
  var h='<h3>'+(isNew?'Add crane':'Edit crane')+'</h3>'+
    '<div class="row"><label for="s_name">Name</label><input id="s_name" type="text" value="'+esc(c.name)+'"></div>'+
    '<div class="note" style="margin:-4px 0 10px">Crane position relative to midship (X 0 / Y 0)</div>'+
    signed('s_ox','Offset X','' + c.ox,'+FWD / −AFT')+
    signed('s_oy','Offset Y','' + c.oy,'+SB / −PS')+
    '<div class="err" id="s_err"></div>'+
    '<div class="actions"><button class="btn ghost" data-s="cancel">Cancel</button><button class="btn" data-s="ok">'+(isNew?'Add':'Save')+'</button></div>'+
    (isNew?'':'<div class="actions" style="margin-top:14px"><button class="btn danger" data-s="del">Delete crane</button></div>');
  openSheet(h,function(el){
    el.onclick=function(e){
      var b=e.target.closest('button'); if(!b) return;
      if(b.dataset.pmid){ flip(document.getElementById(b.dataset.pmid)); return; }
      var a=b.dataset.s;
      if(a==='cancel') closeSheet();
      else if(a==='del') confirmDelete(c);
      else if(a==='ok'){
        var name=document.getElementById('s_name').value.trim(), ox=num(document.getElementById('s_ox').value), oy=num(document.getElementById('s_oy').value);
        if(!name){ return err('Enter a name'); }
        if(!isFinite(ox)||!isFinite(oy)){ return err('Enter Offset X and Offset Y (numbers)'); }
        if(isNew){ var n={id:uid(),name:name,ox:ox,oy:oy,inp:{r:'',slew:'',h:'',heel:0,trim:0}}; S.cranes.push(n); S.cur=n.id; }
        else { c.name=name; c.ox=ox; c.oy=oy; }
        view='crane'; save(); closeSheet(); render();
      }
    };
    function err(t){ document.getElementById('s_err').textContent=t; }
    if(isNew) setTimeout(function(){ var i=document.getElementById('s_name'); i.focus(); i.select(); },50);
  });
}
function confirmDelete(c){
  openSheet('<h3>Delete “'+esc(c.name)+'”?</h3><div class="note">Crane position and input data will be removed.</div>'+
    '<div class="actions" style="margin-top:16px"><button class="btn ghost" data-s="no">Cancel</button><button class="btn danger" data-s="yes">Delete</button></div>',
    function(el){ el.onclick=function(e){ var b=e.target.closest('button'); if(!b) return;
      if(b.dataset.s==='yes'){ S.cranes=S.cranes.filter(function(x){return x.id!==c.id}); S.cur=S.cranes.length?S.cranes[0].id:null; save(); closeSheet(); render(); }
      else closeSheet(); }; });
}
function menu(){
  openSheet('<h3>Backup & help</h3>'+
    '<div class="row"><label>Backup (copy this text to keep or move cranes to another phone)</label><textarea id="s_js" spellcheck="false">'+esc(JSON.stringify({cranes:S.cranes}))+'</textarea></div>'+
    '<div class="err" id="s_err"></div>'+
    '<div class="actions"><button class="btn ghost" data-s="sel">Select all</button><button class="btn" data-s="imp">Import from text</button></div>'+
    '<div class="card" style="margin-top:16px"><h2>Formula (as Excel sheet)</h2><div class="note">'+
    '<code>Ahead/Astern = OffX + R·cos(Slew) + H·sin(Trim)</code><br><code>SB/PS = OffY + R·sin(Slew) + H·sin(Heel)</code><br><br>'+
    'R – radius, H – height of wire point, Slew 0° = bow, 90° = SB.<br>Signs: X +FWD / −AFT · Y +SB / −PS · Heel +SB / −PS · Trim +FWD / −AFT.</div></div>'+
    '<div class="actions" style="margin-top:12px"><button class="btn ghost" data-s="close">Close</button></div>',
    function(el){ el.onclick=function(e){ var b=e.target.closest('button'); if(!b) return; var ta=document.getElementById('s_js');
      if(b.dataset.s==='sel'){ ta.focus(); ta.select(); var msg=document.getElementById('s_err');
        if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(ta.value).then(function(){msg.textContent='Copied to clipboard';},function(){msg.textContent='Selected – copy manually';}); }
        else { try{ document.execCommand('copy'); msg.textContent='Selected (copied if supported)'; }catch(x){} } }
      else if(b.dataset.s==='imp'){ try{ var j=JSON.parse(ta.value); if(!Array.isArray(j.cranes)) throw 0;
          j.cranes.forEach(function(c){ if(typeof c.name!=='string'||!isFinite(num(c.ox))||!isFinite(num(c.oy))) throw 0; c.id=c.id||uid(); c.ox=num(c.ox); c.oy=num(c.oy); c.inp=c.inp||{}; });
          S.cranes=j.cranes; S.cur=S.cranes.length?S.cranes[0].id:null; view='crane'; save(); closeSheet(); render();
        }catch(x){ document.getElementById('s_err').textContent='Invalid backup text'; } }
      else closeSheet(); }; });
}
function flip(inp){
  var v=inp.value.trim(); if(v===''||v==='0') return;
  inp.value = v.charAt(0)==='-' ? v.slice(1) : '-'+v;
  inp.dispatchEvent(new Event('input',{bubbles:true}));
}

/* ---- events ---- */
document.addEventListener('click',function(e){
  if(e.target.closest('#sheet')) return;
  var t=e.target.closest('[data-tab],[data-act],[data-pm]'); if(!t) return;
  if(t.dataset.tab){ if(t.dataset.tab==='__all') view='all'; else { view='crane'; S.cur=t.dataset.tab; save(); } render(); window.scrollTo(0,0); }
  else if(t.dataset.act==='add') craneForm(null);
  else if(t.dataset.act==='edit') craneForm(find(S.cur));
  else if(t.dataset.pm) flip(document.getElementById('f_'+t.dataset.pm));
});
document.getElementById('main').addEventListener('input',function(e){
  var k=e.target.dataset&&e.target.dataset.k; if(!k) return;
  var c=find(S.cur); if(!c) return;
  c.inp[k]=e.target.value; save(); update();
});
document.getElementById('btnAll').onclick=function(){ view = view==='all'?'crane':'all'; render(); };
document.getElementById('btnMenu').onclick=menu;

load(); render();
window.__rot={calc:calc,S:function(){return S}};
/* PWA: offline cache when served over http(s) (GitHub Pages); ignored inside the Android APK (file://) */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
})();
</script>
